# pyproject.toml
[project]
name = "tonofdevelopervoice"
version = "0.1.0"
description = "Rewrite AI-generated commit/PR text into authentic pre-2021 engineering style"
requires-python = ">=3.11"
dependencies = ["pyyaml", "flask", "scikit-learn"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
exclude = ["^training/"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = ['if __name__ == "__main__":']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonofdevelopervoice"]
